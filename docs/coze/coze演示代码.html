<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理助手 - 测试页面</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #faf7f2;
            --bg-secondary: #f5efe6;
            --bg-card: #ffffff;
            --text-primary: #3d3d3d;
            --text-secondary: #7a7a7a;
            --accent: #d4a574;
            --accent-light: #e8c9a8;
            --accent-dark: #b8956a;
            --success: #7fb069;
            --error: #d66853;
            --shadow: 0 4px 20px rgba(180, 160, 140, 0.15);
            --shadow-hover: 0 8px 30px rgba(180, 160, 140, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(212, 165, 116, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(212, 165, 116, 0.08) 0%, transparent 50%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
            min-height: 100vh;
        }

        .sidebar {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
            position: sticky;
            top: 20px;
        }

        .logo {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 1.8rem;
            color: var(--accent-dark);
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .logo-sub {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--bg-secondary);
        }

        .user-info {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .user-info .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .user-info .value {
            font-weight: 600;
            color: var(--text-primary);
        }

        .conversations-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .conversations-header h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .new-chat-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .new-chat-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            margin: 0 -8px;
        }

        .conversation-item {
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            margin: 4px 8px;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
        }

        .conversation-item:hover {
            background: var(--bg-secondary);
        }

        .conversation-item.active {
            background: var(--accent-light);
        }

        .conversation-item .title {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .conversation-item .delete-btn {
            opacity: 0;
            background: none;
            border: none;
            color: var(--error);
            cursor: pointer;
            padding: 4px;
            transition: opacity 0.2s;
        }

        .conversation-item:hover .delete-btn {
            opacity: 1;
        }

        .main-chat {
            background: var(--bg-card);
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
            overflow: hidden;
        }

        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--bg-secondary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4rem;
        }

        .chat-header .info h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .chat-header .info p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--bg-secondary);
            border-bottom-left-radius: 6px;
        }

        .message .typing {
            display: inline-flex;
            gap: 4px;
        }

        .message .typing span {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .message .typing span:nth-child(1) { animation-delay: -0.32s; }
        .message .typing span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-area {
            padding: 20px 24px;
            border-top: 1px solid var(--bg-secondary);
            display: flex;
            gap: 12px;
        }

        .input-area textarea {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid var(--bg-secondary);
            border-radius: 16px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
            background: var(--bg-primary);
        }

        .input-area textarea:focus {
            border-color: var(--accent);
        }

        .send-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 14px 28px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--accent-dark);
            transform: translateY(-2px);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(250, 247, 242, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .login-card {
            background: var(--bg-card);
            padding: 48px;
            border-radius: 24px;
            box-shadow: var(--shadow-hover);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .login-card h1 {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 2rem;
            color: var(--accent-dark);
            margin-bottom: 8px;
        }

        .login-card p {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .login-card input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--bg-secondary);
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.3s;
        }

        .login-card input:focus {
            border-color: var(--accent);
        }

        .login-card button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .login-card button:hover {
            background: var(--accent-dark);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            background: rgba(127, 176, 105, 0.15);
            color: var(--success);
        }

        .status-badge .dot {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .hidden {
            display: none !important;
        }

        .error-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--error);
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-hover);
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <h1>心理助手</h1>
            <p>请先登录以使用服务</p>
            <input type="email" id="loginEmail" placeholder="邮箱">
            <input type="password" id="loginPassword" placeholder="密码">
            <button onclick="login()">登录</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="logo">心理助手</div>
            <div class="logo-sub">温暖陪伴，倾听心声</div>
            
            <div class="user-info">
                <div class="label">当前用户</div>
                <div class="value" id="userName">-</div>
            </div>

            <div class="conversations-header">
                <h3>对话记录</h3>
                <button class="new-chat-btn" onclick="newChat()">新对话</button>
            </div>

            <div class="conversations-list" id="conversationsList">
            </div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <div class="avatar">🌸</div>
                <div class="info">
                    <h2>心理助手</h2>
                    <span class="status-badge">
                        <span class="dot"></span>
                        在线
                    </span>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">
                    <div class="icon">💭</div>
                    <p>开始一段温暖的对话吧~<br>我会一直在这里倾听你</p>
                </div>
            </div>

            <div class="input-area">
                <textarea id="messageInput" rows="2" placeholder="说点什么吧..." onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        // 修改API_BASE为完整的URL，包含http协议
        const API_BASE = 'http://127.0.0.1:2324/api/v1';
        let currentUser = null;
        let currentConversationId = '';
        let isStreaming = false;

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showToast('请填写邮箱和密码');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/user/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (data.code === 200) {
                    currentUser = data.data;
                    document.getElementById('userName').textContent = currentUser.name || email;
                    document.getElementById('loginOverlay').classList.add('hidden');
                    loadConversations();
                } else {
                    showToast(data.msg || '登录失败');
                }
            } catch (err) {
                showToast('网络错误，请重试');
            }
        }

        async function checkAuth() {
            try {
                // 现在会请求 http://127.0.0.1:2324/api/v1/user/me
                const res = await fetch(`${API_BASE}/user/me`, { credentials: 'include' });
                const data = await res.json();
                if (data.code === 200) {
                    currentUser = data.data;
                    document.getElementById('userName').textContent = currentUser.name || '用户';
                    document.getElementById('loginOverlay').classList.add('hidden');
                    loadConversations();
                }
            } catch (err) {
                console.log('未登录');
            }
        }

        async function loadConversations() {
            try {
                const res = await fetch(`${API_BASE}/ai/conversations`, { credentials: 'include' });
                const data = await res.json();
                if (data.code === 200) {
                    renderConversations(data.data || []);
                }
            } catch (err) {
                console.error('加载会话列表失败', err);
            }
        }

        function renderConversations(conversations) {
            const container = document.getElementById('conversationsList');
            if (conversations.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:20px;font-size:0.85rem;">暂无对话记录</div>';
                return;
            }

            container.innerHTML = conversations.map(conv => `
                <div class="conversation-item ${conv.conversationId === currentConversationId ? 'active' : ''}" 
                     data-id="${conv.conversationId}"
                     onclick="selectConversation('${conv.conversationId}', '${conv.title || '新对话'}')">
                    <span class="title">${conv.title || '新对话'}</span>
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteConversation('${conv.conversationId}')">✕</button>
                </div>
            `).join('');
        }

        async function selectConversation(id, title) {
            currentConversationId = id;
            document.querySelectorAll('.conversation-item').forEach(el => {
                el.classList.remove('active');
                if (el.dataset.id === id) {
                    el.classList.add('active');
                }
            });
            
            clearMessages();
            await loadMessages(id);
        }

        async function loadMessages(conversationId) {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '<div class="loading">加载中...</div>';

            try {
                const res = await fetch(`${API_BASE}/ai/messages?conversationId=${conversationId}`, { 
                    credentials: 'include' 
                });
                const data = await res.json();
                
                if (data.code === 200 && data.data) {
                    container.innerHTML = '';
                    data.data.forEach(msg => {
                        const role = msg.role === 'user' ? 'user' : 'assistant';
                        addMessage(msg.content, role);
                    });
                    scrollToBottom();
                } else {
                    container.innerHTML = '<div class="empty-state"><div class="icon">💭</div><p>无法加载消息</p></div>';
                }
            } catch (err) {
                console.error('加载消息失败', err);
                container.innerHTML = '<div class="empty-state"><div class="icon">💭</div><p>加载消息失败</p></div>';
            }
        }

        function newChat() {
            currentConversationId = '';
            clearMessages();
            document.querySelectorAll('.conversation-item').forEach(el => el.classList.remove('active'));
        }

        function clearMessages() {
            document.getElementById('messagesContainer').innerHTML = `
                <div class="empty-state">
                    <div class="icon">💭</div>
                    <p>开始一段温暖的对话吧~<br>我会一直在这里倾听你</p>
                </div>
            `;
        }

        async function deleteConversation(id) {
            if (!confirm('确定删除这个对话吗？')) return;
            
            try {
                const res = await fetch(`${API_BASE}/ai/conversation/del`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ conversationId: id })
                });
                const data = await res.json();
                if (data.code === 200) {
                    if (currentConversationId === id) {
                        newChat();
                    }
                    loadConversations();
                } else {
                    showToast(data.msg);
                }
            } catch (err) {
                showToast('删除失败');
            }
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || isStreaming) return;

            isStreaming = true;
            document.getElementById('sendBtn').disabled = true;
            input.value = '';

            addMessage(message, 'user');
            const assistantMsg = addMessage('', 'assistant', true);

            try {
                const res = await fetch(`${API_BASE}/ai/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        conversationId: currentConversationId,
                        message: message
                    })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const text = decoder.decode(value);
                    const lines = text.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            try {
                                const json = JSON.parse(line.substring(5).trim());
                                if (json.type === 'content') {
                                    fullContent += json.content;
                                    assistantMsg.innerHTML = fullContent.replace(/\n/g, '<br>');
                                    scrollToBottom();
                                } else if (json.type === 'conversation') {
                                    currentConversationId = json.conversationId;
                                    loadConversations();
                                } else if (json.type === 'done') {
                                    break;
                                } else if (json.type === 'error') {
                                    assistantMsg.innerHTML = `<span style="color:var(--error)">错误: ${json.error}</span>`;
                                }
                            } catch (e) {}
                        }
                    }
                }

                if (!fullContent) {
                    assistantMsg.innerHTML = '抱歉，我没有收到回复...';
                }
            } catch (err) {
                assistantMsg.innerHTML = `<span style="color:var(--error)">网络错误: ${err.message}</span>`;
            } finally {
                isStreaming = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }

        function addMessage(content, role, isTyping = false) {
            const container = document.getElementById('messagesContainer');
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            
            if (isTyping && !content) {
                msg.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            } else {
                msg.innerHTML = content.replace(/\n/g, '<br>');
            }

            container.appendChild(msg);
            scrollToBottom();
            return msg;
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'error-toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
